<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Wishlist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/wishlist.css" />
  </head>

  <header>
    <img id="mascot" src="images/mascot.png" alt="mascot" />
    <nav class="header-nav">
      <a href="dashboard.html">Search</a>
      <a href="wishlist.html" class="active">Wishlist</a>
    </nav>
    <button id="profileBtn">Go to profile</button>
  </header>

  <body>
    <div id="container">
      <div class="wishlist-heading">
        <h1 id="title">My Wishlist</h1>
        <span id="wishlist-count" class="wishlist-count"></span>
      </div>
    </div>

    <div id="empty-state" class="empty-state" hidden>
      <p>📚 No books saved yet.</p>
      <a href="dashboard.html">Search for books to add →</a>
    </div>

    <div id="error-state" class="empty-state" hidden>
      <p>⚠️ Could not load wishlist. Are you logged in?</p>
      <a href="index.html">Go to login →</a>
    </div>

    <div id="wishlist-results" class="wishlist-grid"></div>

    <script src="js/wishlist.js"></script>
    <script>
      document.getElementById("profileBtn").addEventListener("click", () => {
        window.location.href = "profile.html";
      });
    </script>
  </body>
</html>
