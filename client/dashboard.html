<!DOCTYPE html><!--Search/Home Page-->
<html>
    <head>
        <title>Dashboard</title>
        <link rel="stylesheet" href="css/dashboard.css">
    </head>

    <header>
        <img id="mascot" src="images/mascot.png" alt="mascot">
        <button id = "profileBtn">Go to profile</button>
        <button id = "wishlistBtn">My Wishlist</button>
    </header>

    <body>
        <div id="container">

            <div>
                <span id="title">Search for Books or Clubs</span>
            </div>

            <div>
                <input type="text" id="searchInput" placeholder="Search for Books or Clubs..."/>
                <button id="searchBtn">Search</button>
            </div>
        </div>

        <h2>Recently Viewed</h2>
            <div id="recentlyViewed" class="imageScroller">
            </div>

            <h2>Recommended</h2>
            <div class="imageScroller">
                <img src="images/book5.jpg" alt="Book 5">
                <img src="images/book6.jpg" alt="Book 6">
                <img src="images/book7.jpg" alt="Book 7">
                <img src="images/book8.jpg" alt="Book 8">
            </div>

            <h2>Recently Added</h2>
            <div class="imageScroller">
                <img src="images/book9.jpg" alt="Book 9">
                <img src="images/book10.jpg" alt="Book 10">
                <img src="images/book11.jpg" alt="Book 11">
                <img src="images/book12.jpg" alt="Book 12">
            </div>

        <div id="results"></div>

        <script src="js/dashboard.js"></script>
    </body>
</html>
